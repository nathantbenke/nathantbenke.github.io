<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <title>Page not found | Nathan Thomas-Benke</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<main>
    <section class="hero" aria-label="Page not found">
        <h1 class="hero-name">404</h1>
        <p class="hero-positioning">That page doesn't exist. It may have moved in the site rebuild.</p>
        <p><a class="btn btn-primary" href="/">Back to the homepage</a></p>
    </section>
</main>

</body>
</html>
